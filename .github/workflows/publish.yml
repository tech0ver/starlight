name: Publish package

on:
  release:
    types: [published]

concurrency:
  group: publish-starlight-package
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      packages: read
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.pack.outputs.archive_name }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      integrity: ${{ steps.integrity.outputs.integrity }}
      version: ${{ steps.tag.outputs.version }}
      verified_sha: ${{ steps.git.outputs.verified_sha }}
    steps:
      - name: Validate the release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(tag || '');
          if (!match) throw new Error(`Release tag is not a stable canonical version: ${JSON.stringify(tag)}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${tag.slice(1)}\n`);
          NODE

      - name: Require public package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility="$(gh api /orgs/tech0ver/packages/npm/starlight --jq .visibility)"
          if [ "$visibility" != public ]; then
            echo '::error::Make @tech0ver/starlight public in its GitHub Package settings before publishing a release.'
            exit 1
          fi

      - name: Check out the published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify the tag and main ancestry
        id: git
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --force --tags origin
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          resolved_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$resolved_sha" != "$EVENT_SHA" ]; then
            echo "Release tag resolves to $resolved_sha, not event SHA $EVENT_SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$resolved_sha" refs/remotes/origin/main
          printf 'verified_sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun run check:release "$RELEASE_TAG"

      - name: Run behavior tests
        run: bun test

      - name: Build the demo
        run: bun run build

      - name: Pack and check the exact archive
        id: pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          npm pack ./packages/starlight --ignore-scripts --pack-destination "$RUNNER_TEMP"
          archive_name="tech0ver-starlight-${VERSION}.tgz"
          archive="$RUNNER_TEMP/$archive_name"
          test -f "$archive"
          bun scripts/check-package.mjs "$archive"
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=starlight-package-%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Calculate archive integrity
        id: integrity
        env:
          ARCHIVE: ${{ runner.temp }}/${{ steps.pack.outputs.archive_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const bytes = fs.readFileSync(process.env.ARCHIVE);
          const integrity = `sha512-${crypto.createHash('sha512').update(bytes).digest('base64')}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `integrity=${integrity}\n`);
          NODE

      - name: Upload the verified archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Download the verified archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/package

      - name: Verify and publish the archive
        env:
          ARCHIVE_NAME: ${{ needs.verify.outputs.archive_name }}
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: '@tech0ver/starlight'
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
          REGISTRY: https://npm.pkg.github.com
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { spawnSync } = require('node:child_process');

          const versionPattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          if (!versionPattern.test(process.env.PACKAGE_VERSION || '')) throw new Error('Invalid verified package version.');
          const expectedName = `tech0ver-starlight-${process.env.PACKAGE_VERSION}.tgz`;
          if (process.env.ARCHIVE_NAME !== expectedName) throw new Error('Unexpected package archive name.');
          const archive = path.join(process.env.RUNNER_TEMP, 'package', expectedName);
          const bytes = fs.readFileSync(archive);
          const integrity = `sha512-${crypto.createHash('sha512').update(bytes).digest('base64')}`;
          if (integrity !== process.env.EXPECTED_INTEGRITY) throw new Error('Downloaded archive integrity does not match the verified archive.');

          const spec = `${process.env.PACKAGE_NAME}@${process.env.PACKAGE_VERSION}`;
          const view = spawnSync('npm', ['view', spec, 'dist.integrity', '--json', `--registry=${process.env.REGISTRY}`], {
            encoding: 'utf8',
            env: process.env,
          });
          if (view.status === 0) {
            let publishedIntegrity;
            try {
              publishedIntegrity = JSON.parse(view.stdout);
            } catch {
              throw new Error(`Registry returned invalid integrity JSON for ${spec}.`);
            }
            if (publishedIntegrity !== integrity) throw new Error(`${spec} already exists with different contents.`);
            console.log(`${spec} already has the verified integrity; publication is complete.`);
            process.exit(0);
          }

          const viewError = `${view.stdout}\n${view.stderr}`;
          if (!/(^|\s)E404(\s|$)/m.test(viewError)) {
            process.stderr.write(viewError);
            throw new Error(`Registry lookup failed for ${spec}; only E404 means the version is absent.`);
          }

          const publish = spawnSync('npm', ['publish', archive, '--ignore-scripts', `--registry=${process.env.REGISTRY}`], {
            encoding: 'utf8',
            env: process.env,
          });
          process.stdout.write(publish.stdout);
          process.stderr.write(publish.stderr);
          if (publish.status !== 0) throw new Error(`npm publish failed with status ${publish.status}.`);
          NODE

  cleanup-release-pr:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mark the exact Release Please pull request as tagged
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        with:
          script: |
            const sha = process.env.VERIFIED_SHA;
            const version = process.env.RELEASE_VERSION;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Verified SHA is invalid.');
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error('Release version is invalid.');
            }

            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              per_page: 100,
            });
            const branch = 'release-please--branches--main--components--starlight';
            const candidates = associated.filter((pull) => {
              const labels = new Set(pull.labels.map((label) => typeof label === 'string' ? label : label.name));
              return pull.merged_at && pull.merge_commit_sha === sha && pull.base.ref === 'main' &&
                pull.head.ref === branch && (labels.has('autorelease: pending') || labels.has('autorelease: tagged'));
            });

            if (candidates.length === 0 && version === '0.1.0') {
              core.info('Initial release has no Release Please pull request to update.');
              return;
            }
            if (candidates.length !== 1) {
              throw new Error(`Expected one exact Release Please pull request at ${sha}; found ${candidates.length}.`);
            }

            const pull = candidates[0];
            const labels = new Set(pull.labels.map((label) => typeof label === 'string' ? label : label.name));
            if (!labels.has('autorelease: tagged')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                labels: ['autorelease: tagged'],
              });
            }
            if (labels.has('autorelease: pending')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                name: 'autorelease: pending',
              });
            }
